<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000080">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SimCity 1989 – Nachbau</title>
<link rel="stylesheet" href="style.css?v=2026-10-20.2">
</head>
<body>
<div id="app">
  <div id="menubar"></div>
  <div id="main">
    <div id="toolbar">
      <div id="tools"></div>
      <div id="toolinfo"><div id="toolname">&nbsp;</div><div id="toolcost">&nbsp;</div></div>
      <div id="rci-box"><canvas id="rci" width="72" height="92"></canvas></div>
    </div>
    <div id="mapwrap"><canvas id="map"></canvas><div id="cursortip"></div><div id="minimap"><canvas id="minimap-cv" width="120" height="100"></canvas><button id="minimap-toggle" title="Minikarte ein-/ausblenden (Taste K)">–</button></div></div>
  </div>
  <div id="statusbar">
    <span id="st-name" class="st"></span>
    <span id="st-date" class="st"></span>
    <span id="st-funds" class="st"></span>
    <span id="st-pop" class="st"></span>
    <span id="st-speed" class="st"></span>
    <span id="st-rci" class="st" title="Nachfrage"></span>
    <span id="st-online" class="st" hidden></span>
    <span id="st-msg" class="st msg" title="Klicken, um zum Ort der Meldung zu springen"></span>
  </div>
  <div id="windows"></div>
</div>
<input type="file" id="fileinput" accept=".json,.city,application/json" style="display:none">
<script src="js/vendor/firebase-app-compat.js?v=2026-10-20.2"></script>
<script src="js/vendor/firebase-auth-compat.js?v=2026-10-20.2"></script>
<script src="js/vendor/firebase-database-compat.js?v=2026-10-20.2"></script>
<script src="js/firebase-config.js?v=2026-10-20.2"></script>
<script src="js/core.js?v=2026-10-20.2"></script>
<script src="js/mapgen.js?v=2026-10-20.2"></script>
<script src="js/sim.js?v=2026-10-20.2"></script>
<script src="js/sprites.js?v=2026-10-20.2"></script>
<script src="js/scenarios.js?v=2026-10-20.2"></script>
<script src="js/gfx.js?v=2026-10-20.2"></script>
<script src="js/view.js?v=2026-10-20.2"></script>
<script src="js/seasons.js?v=2026-10-20.2"></script>
<script src="js/sound.js?v=2026-10-20.2"></script>
<script src="js/net.js?v=2026-10-20.2"></script>
<script src="js/ui.js?v=2026-10-20.2"></script>
<script src="js/advisor.js?v=2026-10-20.2"></script>
<script src="js/cloud.js?v=2026-10-20.2"></script>
<script src="js/coop.js?v=2026-10-20.2"></script>
<script src="js/main.js?v=2026-10-20.2"></script>
</body>
</html>
